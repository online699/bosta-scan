<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسح الشحنات</title>
<style>
:root{--bg:#eceee8;--ink:#18221d;--mut:#5d6a63;--line:#cfd5cc;--card:#fafbf8;--c:#1f6f5c;--bad:#a52a2a;--warn:#8a5a00;--ok:#1d6b3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif}
.w{max-width:1100px;margin:auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.pri{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.tab{border-width:2px;font-weight:700;padding:10px 20px}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}
.sc{background:var(--card);border:2px solid var(--c);border-radius:12px;padding:18px;margin:14px 0}
.sc label{font-weight:700;display:block;margin-bottom:8px}
.sc input{width:100%;font-size:28px;padding:14px;border:2px solid var(--line);border-radius:8px;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace}
#msg{margin-top:12px;padding:12px 14px;border-radius:8px;display:none;font-weight:600}
#msg.ok{display:block;background:#dcefe2;color:var(--ok)}#msg.warn{display:block;background:#f7ead0;color:var(--warn)}#msg.err{display:block;background:#f5dada;color:var(--bad)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.st b{display:block;font-size:26px}.st span{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.bar input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
th{background:#e3e7df;color:var(--mut)}
td.t{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left;font-weight:700}
.v{font-size:12px;padding:2px 8px;border-radius:99px;background:#dcefe2;color:var(--ok)}.v.u{background:#f7ead0;color:var(--warn)}
.x{color:var(--bad);padding:4px 10px}
dialog{border:1px solid var(--line);border-radius:12px;max-width:640px;width:94%;background:var(--card);color:var(--ink)}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:10px 14px}
legend{font-weight:700;padding:0 6px}
.f{display:grid;gap:4px;margin:8px 0}.f small{color:var(--mut)}
.f input,.f select{padding:8px;border:1px solid var(--line);border-radius:6px;width:100%}
.f input[type=password],.f input.l{direction:ltr;text-align:left}
[hidden]{display:none!important}
.vt{display:flex;gap:8px;margin:16px 0 0}.vt button{border-radius:8px 8px 0 0;font-weight:700}.vt .on{background:var(--c);color:#fff;border-color:var(--c)}
.kd{padding:2px 10px;font-size:12px;border-radius:99px;font-weight:700}.k-return{background:#f5dada;color:var(--bad)}.k-exchange{background:#dde6f7;color:#2b4fa3}.k-delivery{background:#dcefe2;color:var(--ok)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.kp div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}.kp b{display:block;font-size:22px}.kp span{color:var(--mut);font-size:13px}
.tr{display:flex;gap:6px;align-items:flex-end;height:130px;margin:14px 0;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:10px}.tr div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mut)}.tr i{display:block;width:100%;background:var(--c);border-radius:3px 3px 0 0;min-height:2px}
h3{margin:18px 0 8px}#per,#cs{padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:14px}
@media(max-width:640px){.st{grid-template-columns:1fr 1fr}.kp{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="w">
<header><h1>مسح الشحنات</h1><div><button id="bk">نسخة احتياطية</button> <button id="rs">استرجاع</button> <button id="cf" class="pri">إعدادات البراندات وشركات الشحن</button></div></header>
<nav class="tabs" id="tabs"></nav>
<section class="sc"><label for="tn">امسح الباركود أو اكتب رقم الشحنة ثم Enter</label><input id="tn" autocomplete="off" autofocus><div id="msg" role="status"></div></section>
<section class="st"><div><b id="s1">0</b><span>الصادر (توصيل واستبدال)</span></div><div><b id="s2">0</b><span>المرتجعات</span></div><div><b id="s3">0</b><span>حركات اليوم</span></div><div><b id="s4">0</b><span>محاولات مكررة</span></div></section>
<div class="vt"><button data-v="out">الصادر</button><button data-v="ret">المرتجعات</button><button data-v="an">التحليلات</button></div>
<div class="bar"><input type="date" id="dd" aria-label="يوم"><button id="dl">تحميل تقرير اليوم CSV</button><input type="month" id="mm" aria-label="شهر"><button id="ml">تحميل تقرير الشهر CSV</button><button id="dbg" title="ينسخ رد بوسطة بعد حجب بيانات العميل">نسخ رد بوسطة الأخير (تشخيص)</button></div>
<div id="an" hidden><select id="per"><option value="month">الشهر المحدد</option><option value="today">اليوم</option><option value="all">الكل</option></select><select id="cs"><option value="t">العملاء: الأكثر طلبًا</option><option value="r">العملاء: الأكثر مرتجعًا</option></select> <button id="rf">تحديث حالات الشحنات من بوسطة</button> <span id="rfs"></span><div id="anb"></div></div>
<div class="tw" id="tw"><table><thead><tr><th>رقم الشحنة</th><th>النوع</th><th>وقت المسح</th><th>العميل</th><th>المحافظة</th><th>القطع</th><th>الوصف</th><th>COD</th><th>الشحن</th><th>الحالة</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<dialog id="dlg"><form method="dialog" id="cfg"><h2>إعدادات البراندات</h2><div id="bl"></div><button type="button" id="add">+ إضافة براند</button> <button type="button" id="sv" class="pri">حفظ</button> <button value="x">إغلاق</button></form></dialog>
<input type="file" id="fi" accept=".json" hidden>
<script>
const $=s=>document.querySelector(s),KEY='scanapp.v1';
const DEF={brands:[{id:'rchive',name:'Rchive',color:'#1f6f5c',carrier:'bosta'},{id:'seven',name:'SEVEN',color:'#2b4fa3',carrier:'bosta'},{id:'jeanetics',name:'Jeanetics',color:'#7a3b8f',carrier:'bosta'}],scans:{},dups:{},active:'rchive'};
let S=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.brands)return v}catch{}return structuredClone(DEF)})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{msg('تعذر الحفظ في المتصفح. حمّل نسخة احتياطية الآن.','err')}};
const B=()=>S.brands.find(b=>b.id===S.active)||S.brands[0];
const L=id=>S.scans[id]||(S.scans[id]=[]),D=id=>S.dups[id]||(S.dups[id]=[]);
const cairo=iso=>new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo'}).format(new Date(iso));
const ft=iso=>new Date(iso).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,k){const m=$('#msg');m.textContent=t;m.className=k}
function beep(f,d){try{const c=new(window.AudioContext||webkitAudioContext)(),o=c.createOscillator();o.frequency.value=f;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},d)}catch{}}
const KL={delivery:'توصيل',exchange:'استبدال',return:'مرتجع'};let view='out',lastRaw=null;
function render(){
 const b=B();S.active=b.id;document.documentElement.style.setProperty('--c',b.color);
 $('#tabs').innerHTML=S.brands.map(x=>`<button class="tab ${x.id===b.id?'on':''}" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join('');
 const all=L(b.id),today=cairo(new Date().toISOString()),ret=all.filter(s=>s.kind==='return'),out=all.filter(s=>s.kind!=='return');
 $('#s1').textContent=out.length;$('#s2').textContent=ret.length;$('#s3').textContent=all.filter(s=>cairo(s.at)===today).length;$('#s4').textContent=D(b.id).length;
 document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v===view));
 $('#tw').hidden=view==='an';$('#an').hidden=view!=='an';
 if(view==='an')return an(all);
 const l=view==='ret'?ret:out;
 $('#rows').innerHTML=l.length?l.slice(-200).reverse().map(s=>{const k=s.kind||'delivery';return `<tr><td class="t">${esc(s.tn)}</td><td><button class="kd k-${k}" data-k="${esc(s.id)}" title="${esc((s.bt||'')+' / '+(s.st||''))} — اضغط لتغيير النوع">${KL[k]}</button></td><td>${esc(ft(s.at))}</td><td>${esc(s.cn||'—')}<br><small style="color:var(--mut);unicode-bidi:plaintext">${esc(s.cp||'')}</small></td><td>${esc(s.gov||'—')}</td><td>${esc(s.items??'—')}</td><td>${esc(s.desc||s.doc||'—')}</td><td>${esc(s.cod??'—')}</td><td>${esc(s.fees??'—')}</td><td>${esc(s.st||(s.ver==='VERIFIED'?'—':'بدون تحقق'))}</td><td><button class="x" data-del="${esc(s.id)}">حذف</button></td></tr>`}).join(''):`<tr><td colspan="11">${view==='ret'?'لا توجد مرتجعات لهذا البراند.':'لا توجد شحنات لهذا البراند. ابدأ بمسح أول باركود.'}</td></tr>`;
}
const OCD=/^\s*delivered/i,OCR=/returned|rto/i,ck=s=>String(s.cp||'').replace(/\D/g,'').slice(-10)||(s.cn||'').trim()||'—';
function outcomes(all,l){
 const rs=new Set(all.filter(s=>s.kind==='return').map(s=>s.tn.toLowerCase())),ot=new Set(all.filter(s=>s.kind!=='return').map(s=>s.tn.toLowerCase()));
 return l.filter(s=>s.kind!=='return'||!ot.has(s.tn.toLowerCase())).map(s=>({s,o:rs.has(s.tn.toLowerCase())||OCR.test(s.st||'')?'r':OCD.test(s.st||'')?'d':'p'}));
}
function custHtml(all,l){
 const oc=outcomes(all,l),n=x=>oc.filter(y=>y.o===x).length,d=n('d'),r=n('r'),p=n('p'),f=d+r,pc=(a,b)=>b?Math.round(a/b*100)+'%':'—',g={};
 oc.forEach(({s,o})=>{const k=ck(s);if(k==='—')return;const x=g[k]||(g[k]={n:s.cn,p:s.cp,t:0,d:0,r:0,q:0});if(!x.n)x.n=s.cn;x.t++;x[o==='p'?'q':o]++});
 const cs=Object.values(g).sort($('#cs').value==='r'?(a,b)=>b.r-a.r||b.t-a.t:(a,b)=>b.t-a.t);
 const kp=[['شحنات مستلمة',d],['مرتجعة / لم تُستلم',r],['قيد التوصيل',p],['نسبة الاستلام',pc(d,f)],['نسبة المرتجع',pc(r,f)],['عملاء استلموا',cs.filter(c=>c.d>0).length],['عملاء لم يستلموا',cs.filter(c=>c.d===0&&c.r>0).length],['عملاء متكررون',cs.filter(c=>c.t>1).length]];
 return{kp:`<h3>الاستلام والمرتجع (من الشحنات اللي اتحسمت)</h3><div class="kp">${kp.map(([a,v])=>`<div><b>${v}</b><span>${a}</span></div>`).join('')}</div>${p&&!f?'<p>الحالات لسه ماتحدثتش. اضغط "تحديث حالات الشحنات من بوسطة".</p>':''}`,
 tbl:`<h3>العملاء</h3><div class="tw"><table style="min-width:640px"><thead><tr><th>العميل</th><th>التليفون</th><th>الطلبات</th><th>استلم</th><th>مرتجع</th><th>قيد التوصيل</th><th>نسبة الاستلام</th></tr></thead><tbody>${cs.slice(0,25).map(c=>`<tr><td>${esc(c.n||'—')}</td><td style="unicode-bidi:plaintext">${esc(c.p||'—')}</td><td>${c.t}</td><td>${c.d}</td><td>${c.r}</td><td>${c.q}</td><td>${pc(c.d,c.d+c.r)}</td></tr>`).join('')||'<tr><td colspan="7">مفيش بيانات عملاء. بيانات العميل بتتسجل مع الشحنات الجديدة، والقديمة بتتكمل بزرار التحديث.</td></tr>'}</tbody></table></div>`};
}
function an(all){
 const p=$('#per').value,t=cairo(new Date().toISOString()),m=$('#mm').value;
 const l=all.filter(s=>p==='all'||(p==='today'?cairo(s.at)===t:cairo(s.at).startsWith(m)));
 const out=l.filter(s=>s.kind!=='return'),ret=l.filter(s=>s.kind==='return'),sm=(a,k)=>a.reduce((t,s)=>t+(Number(s[k])||0),0);
 const kp=[['طلبات صادرة',out.length],['مرتجعات',ret.length],['نسبة المرتجع',out.length?Math.round(ret.length/out.length*100)+'%':'—'],['صافي القطع',sm(l,'items')],['صافي COD',sm(l,'cod')],['صافي الشحن',sm(l,'fees')]];
 const grp=f=>{const g={};l.forEach(s=>{const k=f(s)||'غير محدد',x=g[k]||(g[k]={o:0,r:0,it:0,co:0,fe:0});s.kind==='return'?x.r++:x.o++;x.it+=Number(s.items)||0;x.co+=Number(s.cod)||0;x.fe+=Number(s.fees)||0});return Object.entries(g).sort((a,b)=>b[1].o+b[1].r-a[1].o-a[1].r).slice(0,15)};
 const tb=(r,h)=>`<div class="tw"><table style="min-width:600px"><thead><tr><th>${h}</th><th>صادر</th><th>مرتجع</th><th>صافي القطع</th><th>صافي COD</th><th>صافي الشحن</th></tr></thead><tbody>${r.map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.o}</td><td>${x.r}</td><td>${x.it}</td><td>${x.co}</td><td>${x.fe}</td></tr>`).join('')||'<tr><td colspan="6">لا بيانات في الفترة دي.</td></tr>'}</tbody></table></div>`;
 const cu=custHtml(all,l),dm={};out.forEach(s=>{const d=cairo(s.at);dm[d]=(dm[d]||0)+1});const dk=Object.keys(dm).sort().slice(-14),mx=Math.max(1,...dk.map(k=>dm[k]));
 $('#anb').innerHTML=`<div class="kp">${kp.map(([a,v])=>`<div><b>${v}</b><span>${a}</span></div>`).join('')}</div>${cu.kp}<h3>الطلبات الصادرة يوميًا</h3><div class="tr">${dk.map(k=>`<div title="${k}: ${dm[k]}">${dm[k]}<i style="height:${dm[k]/mx*80}%"></i><span>${k.slice(5)}</span></div>`).join('')||'لا بيانات'}</div><h3>المحافظات</h3>${tb(grp(s=>s.gov),'المحافظة')}<h3>المنتجات (حسب وصف الشحنة)</h3>${tb(grp(s=>s.desc||s.doc),'المنتج')}${cu.tbl}`;
}
const num=v=>Number.isFinite(Number(v))&&v!==''&&v!=null?Number(v):null;
const find=(o,k,n=0)=>{if(!o||typeof o!=='object'||n>6)return;if(o[k]&&typeof o[k]==='object')return o[k];for(const v of Object.values(o)){const r=find(v,k,n+1);if(r)return r}};
const red=o=>Array.isArray(o)?o.map(red):o&&typeof o==='object'?Object.fromEntries(Object.entries(o).map(([k,v])=>[k,/first|last|full|phone|mail|line|note|floor|apart|build|lat|lng|long/i.test(k)&&typeof v!=='object'?'[محجوب]':red(v)])):o;
const tx=v=>typeof v==='string'?v:'';
async function verify(b,tn){
 if(!b.carrier||b.carrier==='none')return{ver:'UNVERIFIED',ship:{},kind:'delivery'};
 if(!b.apiKey)throw new Error(`مفتاح الـ API غير مضاف لـ ${b.name}. افتح الإعدادات وأضفه.`);
 let url,auth=b.apiKey;
 if(b.carrier==='bosta')url='https://app.bosta.co/api/v2/deliveries/business/'+encodeURIComponent(tn);
 else{if(!b.tpl)throw new Error('رابط التحقق غير مضاف في إعدادات '+b.name);url=b.tpl.replace('{tracking}',encodeURIComponent(tn));auth=(b.pre||'')+b.apiKey}
 const px=(b.proxy||'').trim().replace(/\/$/,''),h={Authorization:auth};let r;
 try{r=await fetch(px?px+'/?url='+encodeURIComponent(url):url,{headers:h})}
 catch{throw new Error('تعذر الاتصال بشركة الشحن. غالبًا المتصفح بيمنع الطلب المباشر (CORS). أضف رابط Proxy في إعدادات البراند (الخطوات في README).')}
 if(r.status===404)throw new Error('شركة الشحن لم تجد هذه الشحنة. لم تُسجل.');
 if(r.status===401||r.status===403)throw new Error('مفتاح الـ API مرفوض لـ '+b.name+'. راجع المفتاح.');
 if(!r.ok)throw new Error('فشل التحقق (HTTP '+r.status+'). لم تُسجل.');
 if(b.carrier!=='bosta')return{ver:'VERIFIED',ship:{},kind:'delivery'};
 const p=await r.json().catch(()=>null),d=p&&p.data;
 if(!p||p.success!==true||!d||typeof d!=='object')throw new Error('بوسطة لم ترجع بيانات للشحنة. لم تُسجل.');
 lastRaw=d;
 const rc=d.receiver||{},pk=find(d,'packageDetails')||{},ty=d.type,tc=Number(ty&&ty.code!=null?ty.code:ty),tv=tx(ty&&ty.value)||tx(ty),st=tx(d.state&&d.state.value)||tx(d.maskedState);
 const kind=(tc===25||/return/i.test(tv)||/return|rto/i.test(st))?'return':(tc===30||/exchange/i.test(tv))?'exchange':'delivery';
 return{ver:'VERIFIED',kind,ship:{gov:(d.city&&d.city.name)||(d.dropOffAddress&&d.dropOffAddress.city&&d.dropOffAddress.city.name)||'',cod:num(d.cod),fees:num(d.shipmentFees),items:num(pk.itemsCount),desc:tx(pk.description),doc:tx(pk.document),st,bt:tv||(isNaN(tc)?'':tc),cn:tx(rc.fullName)||[tx(rc.firstName),tx(rc.lastName)].join(' ').trim(),cp:String(rc.phone||'')}};
}
async function handle(b,tn){
 if(!/^[A-Za-z0-9\-_.]{1,100}$/.test(tn)){msg('رقم الشحنة غير صالح: '+tn,'err');beep(220,400);return}
 let r;try{r=await verify(b,tn)}catch(e){msg(e.message,'err');beep(220,400);return}
 const k=r.kind,e=L(b.id).find(s=>s.tn.toLowerCase()===tn.toLowerCase()&&(s.kind||'delivery')===k);
 if(e){D(b.id).push({tn,kind:k,at:new Date().toISOString()});save();render();msg(`مكررة: ${tn} مسجلة قبل كده كـ${KL[k]} في ${b.name} (${ft(e.at)}). لم تُضف.`,'warn');beep(220,400);return}
 const sg=k==='return'?-1:1,sh=r.ship,ng=v=>v==null?null:sg*Math.abs(v);
 L(b.id).push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),tn,at:new Date().toISOString(),ver:r.ver,kind:k,...sh,items:ng(sh.items),cod:ng(sh.cod),fees:ng(sh.fees)});
 save();render();
 const miss=r.ver==='VERIFIED'&&b.carrier==='bosta'&&sh.items==null?' ⚠ بوسطة لم ترجع عدد القطع (اضغط "نسخ رد بوسطة" وابعته للتشخيص).':'';
 msg(`تمت إضافة ${tn} (${KL[k]}) إلى ${b.name}`+(r.ver==='VERIFIED'?' بعد التحقق.':' (بدون تحقق).')+miss,miss||k==='return'||r.ver!=='VERIFIED'?'warn':'ok');beep(880,90);
}
let chain=Promise.resolve();
$('#tn').addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const tn=e.target.value.trim();e.target.value='';if(!tn)return;const b=B();chain=chain.then(()=>handle(b,tn))});
$('#tabs').onclick=e=>{const id=e.target.dataset.id;if(id){S.active=id;save();render();$('#msg').className='';$('#tn').focus()}};
$('#rows').onclick=e=>{const id=e.target.dataset.del;if(!id)return;const b=B(),s=L(b.id).find(x=>x.id===id);if(s&&confirm(`حذف الشحنة ${s.tn} من ${b.name}؟`)){S.scans[b.id]=L(b.id).filter(x=>x.id!==id);save();render()}};
function csvc(v){let s=v==null?'':String(v);if(typeof v==='string'&&/^[=+\-@\t\r]/.test(s)&&!/^-?\d+(\.\d+)?$/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'}
function dlf(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const csv=r=>'\uFEFF'+r.map(x=>x.map(csvc).join(',')).join('\r\n');
const AH=['delivery_shipments','exchange_shipments','return_shipments','out_items','return_items','net_items','out_cod','return_cod','net_cod','out_fees','return_fees','net_fees'];
const agg=a=>{const o=a.filter(s=>s.kind!=='return'),r=a.filter(s=>s.kind==='return'),f=(x,k)=>x.reduce((t,s)=>t+(Number(s[k])||0),0);return[o.filter(s=>s.kind!=='exchange').length,o.filter(s=>s.kind==='exchange').length,r.length,f(o,'items'),f(r,'items'),f(a,'items'),f(o,'cod'),f(r,'cod'),f(a,'cod'),f(o,'fees'),f(r,'fees'),f(a,'fees')]};
$('#dl').onclick=()=>{const b=B(),d=$('#dd').value,rows=L(b.id).filter(s=>cairo(s.at)===d);
 dlf(`Daily_${b.name}_${d}.csv`,csv([['scan_id','scanned_at','tracking_number','type','customer_name','customer_phone','governorate','items_count','description','document','cod','shipping_fees','shipment_status','verification'],...rows.map(s=>[s.id,s.at,s.tn,s.kind||'delivery',s.cn,s.cp,s.gov,s.items,s.desc,s.doc,s.cod,s.fees,s.st,s.ver]),[],['SUMMARY',...AH],['',...agg(rows)]]),'text/csv')};
$('#ml').onclick=()=>{const b=B(),m=$('#mm').value,sc=L(b.id).filter(s=>cairo(s.at).startsWith(m)),du=D(b.id).filter(x=>cairo(x.at).startsWith(m));
 const days=[...new Set([...sc.map(s=>cairo(s.at)),...du.map(x=>cairo(x.at))])].sort();
 dlf(`Monthly_${b.name}_${m}.csv`,csv([['date',...AH,'duplicate_attempts'],...days.map(d=>[d,...agg(sc.filter(s=>cairo(s.at)===d)),du.filter(x=>cairo(x.at)===d).length]),['TOTAL',...agg(sc),du.length]]),'text/csv')};
$('#dbg').onclick=()=>{if(!lastRaw)return msg('امسح شحنة بوسطة حقيقية الأول، وبعدين اضغط الزرار.','warn');navigator.clipboard.writeText(JSON.stringify(red(lastRaw),null,1)).then(()=>msg('تم نسخ رد بوسطة (بعد حجب بيانات العميل). الصقه في الشات.','ok'),()=>msg('تعذر النسخ.','err'))};
document.querySelector('.vt').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;render();$('#tn').focus()}};$('#per').onchange=$('#cs').onchange=render;
let rfBusy=false;
$('#rf').onclick=async()=>{
 if(rfBusy)return;const b=B(),st=$('#rfs'),rs=new Set(L(b.id).filter(s=>s.kind==='return').map(s=>s.tn.toLowerCase()));
 const todo=L(b.id).filter(s=>s.kind!=='return'&&s.ver==='VERIFIED'&&!rs.has(s.tn.toLowerCase())&&!OCD.test(s.st||'')&&!OCR.test(s.st||'')).sort((a,c)=>(a.chk||'').localeCompare(c.chk||'')).slice(0,100);
 if(!todo.length){st.textContent='كل الشحنات محدّثة (مستلمة أو مرتجعة).';return}
 rfBusy=true;let ok=0,bad=0;
 for(const s of todo){st.textContent=`جاري التحديث ${ok+bad+1}/${todo.length}…`;
  try{const h=(await verify(b,s.tn)).ship;s.st=h.st;s.bt=h.bt;s.cn=s.cn||h.cn;s.cp=s.cp||h.cp;s.gov=s.gov||h.gov;s.desc=s.desc||h.desc;s.doc=s.doc||h.doc;if(s.items==null&&h.items!=null)s.items=h.items;ok++}catch{bad++}
  s.chk=new Date().toISOString();await new Promise(r=>setTimeout(r,250))}
 save();rfBusy=false;st.textContent=`تم تحديث ${ok} شحنة`+(bad?` وفشل ${bad}`:'')+(todo.length===100?' — اضغط تاني لتحديث الباقي.':'.');render()};
$('#rows').addEventListener('click',e=>{const id=e.target.dataset.k;if(!id)return;const s=L(B().id).find(x=>x.id===id);if(!s)return;const o=['delivery','exchange','return'],n=o[(o.indexOf(s.kind||'delivery')+1)%3];if((n==='return')!==(s.kind==='return'))['items','cod','fees'].forEach(k=>{if(s[k]!=null)s[k]=-s[k]});s.kind=n;save();render()});
$('#bk').onclick=()=>dlf(`backup_${cairo(new Date().toISOString())}.json`,JSON.stringify({brands:S.brands.map(({apiKey,...x})=>x),scans:S.scans,dups:S.dups}),'application/json');
$('#rs').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.scans||!j.brands)throw 0;if(!confirm('استرجاع النسخة هيستبدل الشحنات الحالية. متأكد؟'))return;
 j.brands.forEach(x=>{if(!S.brands.some(y=>y.id===x.id))S.brands.push(x)});S.scans=j.scans;S.dups=j.dups||{};save();render()}catch{msg('ملف النسخة الاحتياطية غير صالح.','err')}e.target.value=''};
const fld=(i,k,l,v,t='text',h='',c='')=>`<div class="f"><label>${l}</label><input type="${t}" class="${c}" data-i="${i}" data-k="${k}" value="${esc(v||'')}">${h?`<small>${h}</small>`:''}</div>`;
function cfgRows(){$('#bl').innerHTML=S.brands.map((b,i)=>`<fieldset><legend>${esc(b.name)}</legend>${fld(i,'name','اسم البراند',b.name)}${fld(i,'color','اللون',b.color,'color')}
<div class="f"><label>شركة الشحن</label><select data-i="${i}" data-k="carrier"><option value="bosta" ${b.carrier==='bosta'?'selected':''}>Bosta (بوسطة)</option><option value="custom" ${b.carrier==='custom'?'selected':''}>شركة أخرى (رابط مخصص)</option><option value="none" ${b.carrier==='none'?'selected':''}>بدون تحقق</option></select></div>
${fld(i,'apiKey','مفتاح الـ API لهذا البراند',b.apiKey,'password','يُحفظ في هذا المتصفح فقط. الأفضل مفتاح Read Only.')}
${fld(i,'tpl','رابط التحقق (للشركة الأخرى فقط)',b.tpl,'text','مثال: https://api.example.com/track/{tracking}','l')}${fld(i,'pre','بادئة المفتاح (مثال: Bearer )',b.pre,'text','','l')}
${fld(i,'proxy','رابط Proxy (اختياري)',b.proxy,'text','لو ظهرت رسالة CORS ضع رابط الـ Worker هنا','l')}
${S.brands.length>1?`<button type="button" data-rm="${i}">حذف البراند</button>`:''}</fieldset>`).join('')}
$('#cf').onclick=()=>{cfgRows();$('#dlg').showModal()};
$('#add').onclick=()=>{readCfg();const n=prompt('اسم البراند الجديد؟');if(!n)return;S.brands.push({id:'b'+Date.now().toString(36),name:n.trim(),color:'#555555',carrier:'bosta'});cfgRows()};
$('#bl').onclick=e=>{const i=e.target.dataset.rm;if(i==null)return;readCfg();const b=S.brands[i];if(L(b.id).length&&!confirm(`${b.name} فيه ${L(b.id).length} شحنة. هتتمسح مع البراند. متأكد؟`))return;S.brands.splice(i,1);delete S.scans[b.id];delete S.dups[b.id];cfgRows()};
function readCfg(){document.querySelectorAll('#bl [data-k]').forEach(el=>{S.brands[el.dataset.i][el.dataset.k]=el.value})}
$('#sv').onclick=()=>{readCfg();if(!S.brands.some(b=>b.id===S.active))S.active=S.brands[0].id;save();$('#dlg').close();render()};
$('#dd').value=cairo(new Date().toISOString());$('#mm').value=$('#dd').value.slice(0,7);render();
</script>
</body>
</html>
