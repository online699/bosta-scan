<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسح الشحنات</title>
<script>(()=>{let t;try{t=localStorage.getItem('scanapp.theme')}catch{}if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;try{if(localStorage.getItem('scanapp.lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch{}})()</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:light;--bg:#eceee8;--ink:#18221d;--mut:#5d6a63;--line:#cfd5cc;--card:#fafbf8;--c:#1f6f5c;--bad:#a52a2a;--warn:#8a5a00;--ok:#1d6b3a;--info:#2b4fa3;--th:#e3e7df;--okbg:#dcefe2;--warnbg:#f7ead0;--badbg:#f5dada;--infobg:#dde6f7;--sh:0 1px 2px rgba(20,30,25,.06)}
[data-theme=dark]{color-scheme:dark;--bg:#0e1411;--ink:#e7eee9;--mut:#9aaba1;--line:#28342d;--card:#161e1a;--bad:#ff8f87;--warn:#f2bb5c;--ok:#62d28d;--info:#93b3ff;--th:#1e2923;--okbg:#17352a;--warnbg:#3a2e14;--badbg:#40201f;--infobg:#1d2c4d;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;transition:background .2s,color .2s}
.w{max-width:1100px;margin:auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0}
button,input,select{font:inherit}
input,select{background:var(--card);color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px}
button:hover{border-color:var(--c)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.pri{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.pri:hover{filter:brightness(1.08)}
.mut{color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.tab{border-width:2px;font-weight:700;padding:10px 20px}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}
.sc{background:var(--card);border:2px solid var(--c);border-radius:12px;padding:18px;margin:14px 0}
.sc label{font-weight:700;display:block;margin-bottom:8px}
.sc input{width:100%;font-size:28px;padding:14px;border:2px solid var(--line);border-radius:8px;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace}
#msg{margin-top:12px;padding:12px 14px;border-radius:8px;display:none;font-weight:600}
#msg.ok{display:block;background:var(--okbg);color:var(--ok)}#msg.warn{display:block;background:var(--warnbg);color:var(--warn)}#msg.err{display:block;background:var(--badbg);color:var(--bad)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.st b{display:block;font-size:26px}.st span{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.bar input{padding:8px;border:1px solid var(--line);border-radius:8px}
.bar select{padding:8px;border:1px solid var(--line);border-radius:8px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
th{background:var(--th);color:var(--mut)}
td.t{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left;font-weight:700}
.v{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok)}.v.u{background:var(--warnbg);color:var(--warn)}
.x{color:var(--bad);padding:4px 10px}
.sm{padding:3px 10px;font-size:12px;margin-top:4px}
dialog{border:1px solid var(--line);border-radius:12px;max-width:640px;width:94%;background:var(--card);color:var(--ink)}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:10px 14px}
legend{font-weight:700;padding:0 6px}
.f{display:grid;gap:4px;margin:8px 0}.f small{color:var(--mut)}
.f input,.f select{padding:8px;border:1px solid var(--line);border-radius:6px;width:100%}
.f input[type=password],.f input.l{direction:ltr;text-align:left}
[hidden]{display:none!important}
.vt{display:flex;gap:8px;margin:16px 0 0}.vt button{border-radius:8px 8px 0 0;font-weight:700}.vt .on{background:var(--c);color:#fff;border-color:var(--c)}
.kd{padding:2px 10px;font-size:12px;border-radius:99px;font-weight:700}.k-return{background:var(--badbg);color:var(--bad)}.k-exchange{background:var(--infobg);color:var(--info)}.k-delivery{background:var(--okbg);color:var(--ok)}
h3{margin:18px 0 8px}
/* ===== لوحة التحليلات ===== */
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 16px;box-shadow:var(--sh)}
.tb label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.tb select{padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.tb .sp{flex:1}
.dh h2{margin:0;font-size:22px}.dh p{margin:2px 0 14px;color:var(--mut)}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:0 0 14px}
.kc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow:hidden;box-shadow:var(--sh)}
.kc::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--a,var(--c))}
.kc i{position:absolute;inset-inline-end:12px;top:10px;font-style:normal;font-size:22px}
.kc span{display:block;color:var(--mut);font-size:13px;padding-inline-end:30px}
.kc b{display:block;font-size:28px;line-height:1.25;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.cg{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:0 0 14px}.cg2{grid-template-columns:1fr 1fr}
.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;box-shadow:var(--sh)}
.cc h3{margin:0 0 10px;font-size:15px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
svg.ch{width:100%;height:auto;display:block;direction:ltr}
.ch text{fill:var(--mut);font-size:11px;font-family:inherit}
.ch .g{stroke:var(--line);stroke-width:1}
.dn{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.dn svg{width:150px;flex:none}
.dnl{display:grid;gap:8px;font-size:13px}
.dnl div{display:flex;align-items:center;gap:8px}.dnl i{width:10px;height:10px;border-radius:3px;flex:none}.dnl b{margin-inline-start:auto;padding-inline-start:14px;font-variant-numeric:tabular-nums}
.hb{display:grid;gap:10px}
.hr{display:grid;grid-template-columns:minmax(70px,30%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hr .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr .t{height:10px;background:var(--th);border-radius:99px;overflow:hidden;display:flex}
.hr .t u{display:block;height:100%}
.hr em{font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl{display:block;font-size:12px;font-weight:700;color:var(--mut)}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
@media(max-width:820px){.cg,.cg2{grid-template-columns:1fr}}
@media(max-width:640px){.st{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body.locked .w{display:none}
#lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
body:not(.locked) #lock{display:none}
#lock form{background:var(--card);border:2px solid var(--c);border-radius:14px;padding:22px;width:100%;max-width:380px;box-shadow:var(--sh)}
#lock h2{margin:0 0 6px}
.logo{height:46px;max-width:260px;object-fit:contain;display:block}
.hasbg .w{background:color-mix(in srgb,var(--bg) 85%,transparent);border-radius:16px;margin-block:14px}
#smk{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.pv{display:flex;align-items:center;gap:10px;margin-top:6px}.pv img{max-height:48px;max-width:140px;border:1px solid var(--line);border-radius:6px;background:var(--th)}
.bt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.who{font-size:13px;color:var(--mut);padding-inline:6px}
#msg{margin:14px 0}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}.chk input{width:auto}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
dialog.wd{max-width:860px}
.ysync{display:flex;gap:10px;align-items:center;margin:6px 0 0;font-size:13px}
@media(max-width:640px){.pg{grid-template-columns:1fr}}
</style>
</head>

</div>

<div class="dact"><button type="button" class="pri" data-ua="save" data-id="${esc(id)}">${pend?T('موافقة وحفظ','Approve & save'):T('حفظ','Save')}</button>${nw||pend?'':`<button type="button" data-ua="pw" data-id="${esc(id)}">${T('كلمة مرور جديدة','New password')}</button>`}${nw||self?'':`<button type="button" class="x" data-ua="del" data-id="${esc(id)}">${pend?T('رفض الطلب وحذفه','Reject & delete'):T('حذف المستخدم','Delete user')}</button>`}<button type="button" data-ua="back">${T('رجوع','Back')}</button></div>`;
}
async function uSave(id){
 const nw=id==='new',g=x=>document.getElementById(x),bad=r=>r.err||(r.data&&r.data.error);
 const body={action:nw?'create':'update',...(nw?{username:g('u_n').value.trim(),password:g('u_p').value}:{id}),name:g('u_f').value.trim(),role:g('u_r').value,active:g('u_a').checked,
  brands:[...document.querySelectorAll('#ub [name=ub]:checked')].map(x=>x.value),perms:Object.fromEntries(PERMS.map(([k])=>[k,!!document.querySelector(`#ub [name=up][value=${k}]:checked`)]))};
 const r=await fx('admin-users',body);if(bad(r)){alert(errT(r.err||r.data.error,r.d||r.data));return}
 try{await loadUsers()}catch{}uList()}
$('#ub').onclick=async e=>{const t=e.target.closest('button');if(!t)return;const bad=r=>r.err||(r.data&&r.data.error);
 if(t.dataset.ue){uForm(t.dataset.ue);return}
 const a=t.dataset.ua;if(!a)return;
 if(a==='back'){uList();return}
 if(a==='allb'){document.querySelectorAll('#ub [name=ub]').forEach(c=>{c.checked=true});return}
 if(a==='save'){t.disabled=true;await uSave(t.dataset.id);t.disabled=false;return}
 if(a==='tg'){const u=USERS[t.dataset.id];if(!u)return;t.disabled=true;const r=await fx('admin-users',{action:'update',id:t.dataset.id,active:!u.active});
  if(bad(r)){alert(errT(r.err||r.data.error,r.d||r.data));t.disabled=false;return}try{await loadUsers()}catch{}uList();return}
 if(a==='pw'){const p=await pwAsk(T('كلمة مرور جديدة للمستخدم','New password for the user'));if(!p)return;
  const r=await fx('admin-users',{action:'reset_password',id:t.dataset.id,password:p});alert(bad(r)?errT(r.err||r.data.error,r.d||r.data):T('تم تغيير كلمة المرور.','Password changed.'));return}
 if(a==='del'){const u=USERS[t.dataset.id]||{};if(!confirm(T(`حذف المستخدم ${u.username||''} نهائيًا؟`,`Permanently delete user ${u.username||''}?`)))return;
  const r=await fx('admin-users',{action:'delete',id:t.dataset.id});if(bad(r)){alert(errT(r.err||r.data.error,r.d||r.data));return}
  try{await loadUsers()}catch{}uList()}};
$('#ub').onchange=e=>{const t=e.target;
 if(t.id==='u_r'){const a=t.value==='admin';$('#u_x').hidden=a;$('#u_h').hidden=!a}
 if(t.id==='u_ps'){if(t.value===''){$('#u_hint').textContent='';return}
  const P=PRESETS[+t.value],a=P[2]==='admin';$('#u_r').value=P[2];$('#u_x').hidden=a;$('#u_h').hidden=!a;
  document.querySelectorAll('#ub [name=up]').forEach(c=>{c.checked=P[3].includes(c.value)});
  if(!a&&!document.querySelector('#ub [name=ub]:checked'))document.querySelectorAll('#ub [name=ub]').forEach(c=>{c.checked=true});
  $('#u_hint').textContent=T(P[4],P[5])}};
$('#um').onclick=async()=>{if(!isAdm())return;try{await loadUsers()}catch{}uList();$('#usr').showModal()};
$('#uc').onclick=()=>{$('#usr').close();usrBadge()};
const TK='scanapp.theme';
function theme(t,sv){document.documentElement.dataset.theme=t;const n=t==='dark';$('#th').textContent=n?'☀️ نمط نهاري':'🌙 نمط ليلي';$('#th').setAttribute('aria-pressed',n);if(sv)try{localStorage.setItem(TK,t)}catch{}}
$('#th').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark',1);
theme(document.documentElement.dataset.theme==='dark'?'dark':'light');
$('#bl').addEventListener('change',async e=>{const t=e.target;if(t.dataset.k==='bgType'){readCfg();cfgRows();return}
 const u=t.dataset.up;if(!u||!t.files[0])return;readCfg();
 try{S.brands[t.dataset.i][u]=u==='logo'?await img2url(t.files[0],400,0,1):await img2url(t.files[0],1600,.72,0)}catch{alert(T('تعذر قراءة الصورة.','Could not read the image.'))}
 cfgRows()});
$('#dd').value=cairo(new Date().toISOString());
/* ===== language ===== */
function setLang(l,sv){LANG=l;const h=document.documentElement;h.lang=l;h.dir=l==='en'?'ltr':'rtl';if(sv)try{localStorage.setItem('scanapp.lang',l)}catch{}
 document.title=T('مسح الشحنات','Shipment Scanner');$('#lg').textContent=l==='en'?'🌐 العربية':'🌐 English';loc(document.body)}
new MutationObserver(()=>{if(LANG==='en')loc(document.body)}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','aria-label']});
$('#lg').onclick=()=>{setLang(LANG==='en'?'ar':'en',1);render();if(typeof loginMode==='function')loginMode(signup)};
setLang(LANG);
/* ===== auth (Supabase) ===== */
const toEmail=u=>{u=u.trim().toLowerCase();return u.includes('@')?u:u+'@'+EMAIL_DOMAIN};
function lockUI(){clearInterval(poll);ME=null;USERS={};S=blank();document.body.classList.add('locked');$('#le').textContent='';$('#lp').value='';$('#lu').focus();render()}
function unlock(){document.body.classList.remove('locked');if(can('scan'))$('#tn').focus()}
function applyRole(){
 $('#who').textContent=(ME.name||ME.username)+' · '+(isAdm()?T('مسؤول','Admin'):T('موظف','Staff'));
 $('#cf').hidden=!isAdm();$('#um').hidden=!isAdm();$('#dbg').hidden=!isAdm();
}
async function enter(session){
 const fail=async m=>{try{await sb.auth.signOut()}catch{}lockUI();$('#le').textContent=m;return false};
 try{
  const{data:pf,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error)return fail(T('تعذر قراءة بيانات حسابك: ','Could not read your account: ')+error.message);
  if(!pf)return fail(T('حسابك غير مُعدّ. تواصل مع المسؤول.','Your account is not set up. Contact the admin.'));
  nrm(pf);
 if(!pf.active)return fail(pf.status==='pending'?T('طلبك قيد المراجعة. هتقدر تدخل بعد موافقة المسؤول.','Your request is pending. You can sign in once the admin approves it.'):T('حسابك موقوف (مسودة). تواصل مع المسؤول.','Your account is disabled (draft). Contact the admin.'));
  ME={id:session.user.id,username:pf.username||session.user.email,name:pf.name||'',role:pf.role==='admin'?'admin':'staff',perms:pf.perms||{},brands:pf.brands||[]};
  if(isAdm()){try{await loadUsers()}catch{}}
  await loadBrands();await loadBrand(S.active);
 }catch(e){return fail(T('تعذر تحميل البيانات: ','Could not load data: ')+(e.message||e))}
 applyRole();unlock();render();sync();startPoll();return true;
}
let signup=false;
function loginMode(on){signup=on;$('#lnw').hidden=!on;$('#lcw').hidden=!on;$('#lt').textContent=T(on?'طلب إنشاء حساب':'تسجيل الدخول',on?'Request an account':'Sign in');$('#lul').textContent=T(on?'البريد الإلكتروني':'اسم المستخدم أو البريد',on?'Email':'Username or email');$('#lb').textContent=T(on?'إرسال الطلب':'دخول',on?'Send request':'Sign in');$('#lsw').textContent=T(on?'لدي حساب بالفعل':'طلب إنشاء حساب جديد',on?'I already have an account':'Request a new account');$('#le').textContent='';$('#lm').textContent='';$('#lp').autocomplete=on?'new-password':'current-password'}
$('#lsw').onclick=()=>loginMode(!signup);
$('#lf').onsubmit=async e=>{e.preventDefault();const u=$('#lu').value.trim(),p=$('#lp').value,er=$('#le'),b=$('#lb');er.textContent='';$('#lm').textContent='';
 if(!sb){er.textContent=T('لم يتم ضبط SUPABASE_URL و SUPABASE_KEY أول السكريبت، أو تعذر تحميل مكتبة Supabase.','SUPABASE_URL / SUPABASE_KEY are not set at the top of the script, or the Supabase library failed to load.');return}
 if(signup){
  const nm=$('#ln').value.trim();
  if(!nm){er.textContent=T('اكتب اسمك.','Enter your name.');return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)){er.textContent=T('اكتب بريدًا إلكترونيًا صحيحًا.','Enter a valid email address.');return}
  if(p.length<6){er.textContent=T('كلمة المرور لازم تكون 6 حروف على الأقل.','Password must be at least 6 characters.');return}
  if(p!==$('#lc').value){er.textContent=T('التأكيد غير مطابق.','Confirmation does not match.');return}
  b.disabled=true;
  const{data,error}=await sb.auth.signUp({email:u.toLowerCase(),password:p,options:{data:{name:nm}}});
  if(data&&data.session){try{await sb.auth.signOut()}catch{}}
  b.disabled=false;
  if(error){er.textContent=error.message;return}
  $('#lm').textContent=T('تم إرسال طلبك للمسؤول. هتقدر تدخل بعد الموافقة عليه.','Your request was sent to the admin. You can sign in once it is approved.');$('#lp').value=$('#lc').value='';return}
 if(!u||!p){er.textContent=T('اكتب اسم المستخدم وكلمة المرور.','Enter your username and password.');return}
 b.disabled=true;
 const{data,error}=await sb.auth.signInWithPassword({email:toEmail(u),password:p});
 if(error){await new Promise(r=>setTimeout(r,600));er.textContent=/invalid login/i.test(error.message)?T('اسم المستخدم أو كلمة المرور غير صحيحة.','Wrong username or password.'):/banned|suspend/i.test(error.message)?T('هذا الحساب موقوف.','This account is suspended.'):/confirm/i.test(error.message)?T('أكّد بريدك الإلكتروني أولًا من الرسالة اللي وصلتك.','Please confirm your email first using the message we sent.'):error.message;b.disabled=false;$('#lp').select();return}
 await enter(data.session);b.disabled=false};
$('#lo').onclick=async()=>{try{await sb.auth.signOut()}catch{}lockUI()};
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&ME)lockUI()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME&&Date.now()-S.synced>20000)loadBrand(S.active,true).then(render)});
(async()=>{
 if(!sb){lockUI();$('#le').textContent=T('لم يتم ضبط SUPABASE_URL و SUPABASE_KEY أول السكريبت، أو تعذر تحميل مكتبة Supabase.','SUPABASE_URL / SUPABASE_KEY are not set at the top of the script, or the Supabase library failed to load.');return}
 const{data}=await sb.auth.getSession();
 if(data.session)await enter(data.session);else lockUI();
})();

/* ===== mouse smoke ===== */
const SK='scanapp.smoke';let smokeOn=true;try{const v=localStorage.getItem(SK);smokeOn=v?v==='1':!matchMedia('(prefers-reduced-motion:reduce)').matches}catch{}
const cv=$('#smk'),cx=cv.getContext('2d'),P=[];let raf=0,lx=0,ly=0,hue=0;
function rs(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
function puff(x,y,n){hue=(hue+5)%360;for(let i=0;i<n&&P.length<140;i++)P.push({x:x+(Math.random()-.5)*8,y:y+(Math.random()-.5)*8,vx:(Math.random()-.5)*.8,vy:-.3-Math.random()*.7,r:10+Math.random()*10,l:0,h:hue+Math.random()*50})}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);
 for(let i=P.length-1;i>=0;i--){const p=P[i];if(++p.l>=60){P.splice(i,1);continue}p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=.55;const a=.3*(1-p.l/60),g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
  g.addColorStop(0,`hsla(${p.h},90%,60%,${a})`);g.addColorStop(1,`hsla(${p.h},90%,60%,0)`);cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
 raf=P.length?requestAnimationFrame(tick):0}
addEventListener('pointermove',e=>{if(!smokeOn)return;const d=Math.hypot(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;puff(lx,ly,Math.min(3,1+(d>>3)));if(!raf)raf=requestAnimationFrame(tick)},{passive:true});
function setSmoke(on,sv){smokeOn=on;if(sv)try{localStorage.setItem(SK,on?'1':'0')}catch{}$('#smb').textContent=on?'💨 دخان: تشغيل':'💨 دخان: إيقاف';$('#smb').setAttribute('aria-pressed',on);if(!on){P.length=0;cx.clearRect(0,0,innerWidth,innerHeight)}}
$('#smb').onclick=()=>setSmoke(!smokeOn,1);setSmoke(smokeOn);
</script>
