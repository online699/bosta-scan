<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسح الشحنات</title>
<style>
:root{--bg:#eceee8;--ink:#18221d;--mut:#5d6a63;--line:#cfd5cc;--card:#fafbf8;--c:#1f6f5c;--bad:#a52a2a;--warn:#8a5a00;--ok:#1d6b3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif}
.w{max-width:1100px;margin:auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.pri{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.tab{border-width:2px;font-weight:700;padding:10px 20px}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}
.sc{background:var(--card);border:2px solid var(--c);border-radius:12px;padding:18px;margin:14px 0}
.sc label{font-weight:700;display:block;margin-bottom:8px}
.sc input{width:100%;font-size:28px;padding:14px;border:2px solid var(--line);border-radius:8px;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace}
#msg{margin-top:12px;padding:12px 14px;border-radius:8px;display:none;font-weight:600}
#msg.ok{display:block;background:#dcefe2;color:var(--ok)}#msg.warn{display:block;background:#f7ead0;color:var(--warn)}#msg.err{display:block;background:#f5dada;color:var(--bad)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.st b{display:block;font-size:26px}.st span{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.bar input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
th{background:#e3e7df;color:var(--mut)}
td.t{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left;font-weight:700}
.v{font-size:12px;padding:2px 8px;border-radius:99px;background:#dcefe2;color:var(--ok)}.v.u{background:#f7ead0;color:var(--warn)}
.x{color:var(--bad);padding:4px 10px}
dialog{border:1px solid var(--line);border-radius:12px;max-width:640px;width:94%;background:var(--card);color:var(--ink)}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:10px 14px}
legend{font-weight:700;padding:0 6px}
.f{display:grid;gap:4px;margin:8px 0}.f small{color:var(--mut)}
.f input,.f select{padding:8px;border:1px solid var(--line);border-radius:6px;width:100%}
.f input[type=password],.f input.l{direction:ltr;text-align:left}
@media(max-width:640px){.st{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="w">
<header><h1>مسح الشحنات</h1><div><button id="bk">نسخة احتياطية</button> <button id="rs">استرجاع</button> <button id="cf" class="pri">إعدادات البراندات وشركات الشحن</button></div></header>
<nav class="tabs" id="tabs"></nav>
<section class="sc"><label for="tn">امسح الباركود أو اكتب رقم الشحنة ثم Enter</label><input id="tn" autocomplete="off" autofocus><div id="msg" role="status"></div></section>
<section class="st"><div><b id="s1">0</b><span>إجمالي الشحنات</span></div><div><b id="s2">0</b><span>شحنات اليوم</span></div><div><b id="s3">0</b><span>تم التحقق منها</span></div><div><b id="s4">0</b><span>محاولات مكررة</span></div></section>
<div class="bar"><input type="date" id="dd" aria-label="يوم"><button id="dl">تحميل تقرير اليوم CSV</button><input type="month" id="mm" aria-label="شهر"><button id="ml">تحميل تقرير الشهر CSV</button></div>
<div class="tw"><table><thead><tr><th>رقم الشحنة</th><th>وقت المسح</th><th>المحافظة</th><th>القطع</th><th>COD</th><th>الشحن</th><th>التحقق</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<dialog id="dlg"><form method="dialog" id="cfg"><h2>إعدادات البراندات</h2><div id="bl"></div><button type="button" id="add">+ إضافة براند</button> <button type="button" id="sv" class="pri">حفظ</button> <button value="x">إغلاق</button></form></dialog>
<input type="file" id="fi" accept=".json" hidden>
<script>
const $=s=>document.querySelector(s),KEY='scanapp.v1';
const DEF={brands:[{id:'rchive',name:'Rchive',color:'#1f6f5c',carrier:'bosta'},{id:'seven',name:'SEVEN',color:'#2b4fa3',carrier:'bosta'},{id:'jeanetics',name:'Jeanetics',color:'#7a3b8f',carrier:'bosta'}],scans:{},dups:{},active:'rchive'};
let S=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.brands)return v}catch{}return structuredClone(DEF)})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{msg('تعذر الحفظ في المتصفح. حمّل نسخة احتياطية الآن.','err')}};
const B=()=>S.brands.find(b=>b.id===S.active)||S.brands[0];
const L=id=>S.scans[id]||(S.scans[id]=[]),D=id=>S.dups[id]||(S.dups[id]=[]);
const cairo=iso=>new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo'}).format(new Date(iso));
const ft=iso=>new Date(iso).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,k){const m=$('#msg');m.textContent=t;m.className=k}
function beep(f,d){try{const c=new(window.AudioContext||webkitAudioContext)(),o=c.createOscillator();o.frequency.value=f;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},d)}catch{}}
function render(){
 const b=B();S.active=b.id;document.documentElement.style.setProperty('--c',b.color);
 $('#tabs').innerHTML=S.brands.map(x=>`<button class="tab ${x.id===b.id?'on':''}" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join('');
 const l=L(b.id),today=cairo(new Date().toISOString());
 $('#s1').textContent=l.length;$('#s2').textContent=l.filter(s=>cairo(s.at)===today).length;
 $('#s3').textContent=l.filter(s=>s.ver==='VERIFIED').length;$('#s4').textContent=D(b.id).length;
 $('#rows').innerHTML=l.length?l.slice(-200).reverse().map(s=>`<tr><td class="t">${esc(s.tn)}</td><td>${esc(ft(s.at))}</td><td>${esc(s.gov||'—')}</td><td>${esc(s.items??'—')}</td><td>${esc(s.cod??'—')}</td><td>${esc(s.fees??'—')}</td><td><span class="v ${s.ver==='VERIFIED'?'':'u'}">${s.ver==='VERIFIED'?'تم التحقق':'بدون تحقق'}</span></td><td><button class="x" data-del="${esc(s.id)}">حذف</button></td></tr>`).join(''):'<tr><td colspan="8">لا توجد شحنات لهذا البراند. ابدأ بمسح أول باركود.</td></tr>';
}
const num=v=>Number.isFinite(Number(v))&&v!==''&&v!=null?Number(v):null;
async function verify(b,tn){
 if(!b.carrier||b.carrier==='none')return{ver:'UNVERIFIED',ship:{}};
 if(!b.apiKey)throw new Error(`مفتاح الـ API غير مضاف لـ ${b.name}. افتح الإعدادات وأضفه.`);
 let url,auth=b.apiKey;
 if(b.carrier==='bosta')url='https://app.bosta.co/api/v2/deliveries/business/'+encodeURIComponent(tn);
 else{if(!b.tpl)throw new Error('رابط التحقق غير مضاف في إعدادات '+b.name);url=b.tpl.replace('{tracking}',encodeURIComponent(tn));auth=(b.pre||'')+b.apiKey}
 const px=(b.proxy||'').trim().replace(/\/$/,''),h={Authorization:auth};let r;
 try{r=await fetch(px?px+'/?url='+encodeURIComponent(url):url,{headers:h})}
 catch{throw new Error('تعذر الاتصال بشركة الشحن. غالبًا المتصفح بيمنع الطلب المباشر (CORS). أضف رابط Proxy في إعدادات البراند (الخطوات في README).')}
 if(r.status===404)throw new Error('شركة الشحن لم تجد هذه الشحنة. لم تُسجل.');
 if(r.status===401||r.status===403)throw new Error('مفتاح الـ API مرفوض لـ '+b.name+'. راجع المفتاح.');
 if(!r.ok)throw new Error('فشل التحقق (HTTP '+r.status+'). لم تُسجل.');
 if(b.carrier!=='bosta')return{ver:'VERIFIED',ship:{}};
 const p=await r.json().catch(()=>null),d=p&&p.data;
 if(!p||p.success!==true||!d||typeof d!=='object')throw new Error('بوسطة لم ترجع بيانات للشحنة. لم تُسجل.');
 const pk=d.specs&&d.specs.packageDetails||{};
 return{ver:'VERIFIED',ship:{gov:(d.city&&d.city.name)||(d.dropOffAddress&&d.dropOffAddress.city&&d.dropOffAddress.city.name)||'',cod:num(d.cod),fees:num(d.shipmentFees),items:num(pk.itemsCount),desc:pk.description||'',st:(d.state&&d.state.value)||''}};
}
async function handle(b,tn){
 if(!/^[A-Za-z0-9\-_.]{1,100}$/.test(tn)){msg('رقم الشحنة غير صالح: '+tn,'err');beep(220,400);return}
 const dupe=()=>{const e=L(b.id).find(s=>s.tn.toLowerCase()===tn.toLowerCase());if(!e)return false;D(b.id).push({tn,at:new Date().toISOString()});save();render();msg(`مكررة: ${tn} مسجلة قبل كده في ${b.name} (${ft(e.at)}). لم تُضف.`,'warn');beep(220,400);return true};
 if(dupe())return;
 let r;try{r=await verify(b,tn)}catch(e){msg(e.message,'err');beep(220,400);return}
 if(dupe())return;
 L(b.id).push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),tn,at:new Date().toISOString(),ver:r.ver,...r.ship});
 save();render();msg(`تمت إضافة ${tn} إلى ${b.name}`+(r.ver==='VERIFIED'?' بعد التحقق.':' (بدون تحقق).'),r.ver==='VERIFIED'?'ok':'warn');beep(880,90);
}
let chain=Promise.resolve();
$('#tn').addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const tn=e.target.value.trim();e.target.value='';if(!tn)return;const b=B();chain=chain.then(()=>handle(b,tn))});
$('#tabs').onclick=e=>{const id=e.target.dataset.id;if(id){S.active=id;save();render();$('#msg').className='';$('#tn').focus()}};
$('#rows').onclick=e=>{const id=e.target.dataset.del;if(!id)return;const b=B(),s=L(b.id).find(x=>x.id===id);if(s&&confirm(`حذف الشحنة ${s.tn} من ${b.name}؟`)){S.scans[b.id]=L(b.id).filter(x=>x.id!==id);save();render()}};
function csvc(v){let s=v==null?'':String(v);if(typeof v==='string'&&/^[=+\-@\t\r]/.test(s)&&!/^-?\d+(\.\d+)?$/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'}
function dlf(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#dl').onclick=()=>{const b=B(),d=$('#dd').value;const rows=L(b.id).filter(s=>cairo(s.at)===d);
 const h=['scan_id','scanned_at','tracking_number','governorate','items_count','items_description','cod','shipping_fees','shipment_status','verification'];
 dlf(`Scans_${b.name}_${d}.csv`,'\uFEFF'+[h,...rows.map(s=>[s.id,s.at,s.tn,s.gov,s.items,s.desc,s.cod,s.fees,s.st,s.ver])].map(r=>r.map(csvc).join(',')).join('\r\n'),'text/csv')};
$('#ml').onclick=()=>{const b=B(),m=$('#mm').value,sc=L(b.id).filter(s=>cairo(s.at).startsWith(m)),du=D(b.id).filter(x=>cairo(x.at).startsWith(m));
 const days=[...new Set([...sc.map(s=>cairo(s.at)),...du.map(x=>cairo(x.at))])].sort(),rows=[['date','unique_shipments','duplicate_attempts','total_items','cod_total','shipping_fees_total']];
 for(const d of days){const a=sc.filter(s=>cairo(s.at)===d),sum=k=>a.reduce((t,s)=>t+(Number(s[k])||0),0);rows.push([d,a.length,du.filter(x=>cairo(x.at)===d).length,sum('items'),sum('cod'),sum('fees')])}
 dlf(`Monthly_${b.name}_${m}.csv`,'\uFEFF'+rows.map(r=>r.map(csvc).join(',')).join('\r\n'),'text/csv')};
$('#bk').onclick=()=>dlf(`backup_${cairo(new Date().toISOString())}.json`,JSON.stringify({brands:S.brands.map(({apiKey,...x})=>x),scans:S.scans,dups:S.dups}),'application/json');
$('#rs').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.scans||!j.brands)throw 0;if(!confirm('استرجاع النسخة هيستبدل الشحنات الحالية. متأكد؟'))return;
 j.brands.forEach(x=>{if(!S.brands.some(y=>y.id===x.id))S.brands.push(x)});S.scans=j.scans;S.dups=j.dups||{};save();render()}catch{msg('ملف النسخة الاحتياطية غير صالح.','err')}e.target.value=''};
const fld=(i,k,l,v,t='text',h='',c='')=>`<div class="f"><label>${l}</label><input type="${t}" class="${c}" data-i="${i}" data-k="${k}" value="${esc(v||'')}">${h?`<small>${h}</small>`:''}</div>`;
function cfgRows(){$('#bl').innerHTML=S.brands.map((b,i)=>`<fieldset><legend>${esc(b.name)}</legend>${fld(i,'name','اسم البراند',b.name)}${fld(i,'color','اللون',b.color,'color')}
<div class="f"><label>شركة الشحن</label><select data-i="${i}" data-k="carrier"><option value="bosta" ${b.carrier==='bosta'?'selected':''}>Bosta (بوسطة)</option><option value="custom" ${b.carrier==='custom'?'selected':''}>شركة أخرى (رابط مخصص)</option><option value="none" ${b.carrier==='none'?'selected':''}>بدون تحقق</option></select></div>
${fld(i,'apiKey','مفتاح الـ API لهذا البراند',b.apiKey,'password','يُحفظ في هذا المتصفح فقط. الأفضل مفتاح Read Only.')}
${fld(i,'tpl','رابط التحقق (للشركة الأخرى فقط)',b.tpl,'text','مثال: https://api.example.com/track/{tracking}','l')}${fld(i,'pre','بادئة المفتاح (مثال: Bearer )',b.pre,'text','','l')}
${fld(i,'proxy','رابط Proxy (اختياري)',b.proxy,'text','لو ظهرت رسالة CORS ضع رابط الـ Worker هنا','l')}
${S.brands.length>1?`<button type="button" data-rm="${i}">حذف البراند</button>`:''}</fieldset>`).join('')}
$('#cf').onclick=()=>{cfgRows();$('#dlg').showModal()};
$('#add').onclick=()=>{readCfg();const n=prompt('اسم البراند الجديد؟');if(!n)return;S.brands.push({id:'b'+Date.now().toString(36),name:n.trim(),color:'#555555',carrier:'bosta'});cfgRows()};
$('#bl').onclick=e=>{const i=e.target.dataset.rm;if(i==null)return;readCfg();const b=S.brands[i];if(L(b.id).length&&!confirm(`${b.name} فيه ${L(b.id).length} شحنة. هتتمسح مع البراند. متأكد؟`))return;S.brands.splice(i,1);delete S.scans[b.id];delete S.dups[b.id];cfgRows()};
function readCfg(){document.querySelectorAll('#bl [data-k]').forEach(el=>{S.brands[el.dataset.i][el.dataset.k]=el.value})}
$('#sv').onclick=()=>{readCfg();if(!S.brands.some(b=>b.id===S.active))S.active=S.brands[0].id;save();$('#dlg').close();render()};
$('#dd').value=cairo(new Date().toISOString());$('#mm').value=$('#dd').value.slice(0,7);render();
</script>
</body>
</html>
